openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: generate
    description: AI generation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateGamePlan
      tags: [generate]
      summary: Generate game design document
      description: Takes a game idea and returns a full game plan including design doc, task list, technical challenges, and weekly schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameIdeaInput"
      responses:
        "200":
          description: Generated game plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePlan"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GameIdeaInput:
      type: object
      required:
        - idea
      properties:
        idea:
          type: string
          description: The game idea description
          minLength: 1
        language:
          type: string
          description: "Output language for generated content: zh, ja, en"
          enum: [zh, ja, en]
    GamePlan:
      type: object
      required:
        - designDoc
        - taskList
        - technicalChallenges
        - weeklyPlan
      properties:
        designDoc:
          $ref: "#/components/schemas/DesignDoc"
        taskList:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        technicalChallenges:
          type: array
          items:
            $ref: "#/components/schemas/TechnicalChallenge"
        weeklyPlan:
          type: array
          items:
            $ref: "#/components/schemas/DayPlan"
    DesignDoc:
      type: object
      required:
        - title
        - genre
        - concept
        - coreLoop
        - targetAudience
        - platforms
      properties:
        title:
          type: string
        genre:
          type: string
        concept:
          type: string
        coreLoop:
          type: string
        targetAudience:
          type: string
        platforms:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string
    Task:
      type: object
      required:
        - id
        - category
        - title
        - priority
        - estimatedHours
      properties:
        id:
          type: integer
        category:
          type: string
          description: "Category: art, programming, design, audio, etc."
        title:
          type: string
        description:
          type: ["string", "null"]
        priority:
          type: string
          description: "high, medium, low"
        estimatedHours:
          type: number
    TechnicalChallenge:
      type: object
      required:
        - title
        - difficulty
        - description
        - solution
      properties:
        title:
          type: string
        difficulty:
          type: string
          description: "hard, medium, easy"
        description:
          type: string
        solution:
          type: string
    DayPlan:
      type: object
      required:
        - day
        - label
        - tasks
        - milestone
      properties:
        day:
          type: integer
        label:
          type: string
        tasks:
          type: array
          items:
            type: string
        milestone:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
